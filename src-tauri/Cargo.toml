[package]
name = "trade-blueprint"
version = "0.11.0"
description = "Trade Blueprint desktop application"
authors = ["Pablo Phillipe Cândido dos Santos"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "plano_de_trade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-updater = "2.14.0"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.32", features = ["bundled"] }

# Temporary compatibility patch:
# tauri-plugin-updater 2.14.0 still requires zip ^4, while crates.io has yanked
# every 4.x release. The official v4.6.1 source tag is pinned here so the
# updater keeps its current signed-version protections without downgrading.
[patch.crates-io]
zip = { git = "https://github.com/zip-rs/zip2", tag = "v4.6.1" }
