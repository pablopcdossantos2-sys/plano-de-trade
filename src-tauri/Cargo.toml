[package]
name = "plano-de-trade"
version = "0.6.0"
description = "Plano de Trade desktop application"
authors = ["Pablo Phillipe Cândido dos Santos"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "plano_de_trade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-updater = "2.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

